          if (isBreak) {
            setTimerMode('focus');
            showToast('Switched to Focus mode.');
          } else {
            setTimerMode('break');
            showToast('Switched to Break mode.');
          }
        });

        // Preset mode buttons
        root.querySelectorAll('.timer-mode-btn[data-mode]').forEach(btn => {
          btn.addEventListener('click', () => {
            setTimerMode(btn.dataset.mode);
          });
        });

        // Custom time entry
        document.getElementById('customTimeBtn')?.addEventListener('click', () => {
          const currentMins = Math.round(targetSeconds / 60);
          const userMins = prompt('Enter focus duration in minutes (1 - 180):', currentMins);
          if (userMins !== null) {
            const num = parseInt(userMins, 10);
            if (!isNaN(num) && num >= 1 && num <= 180) {
              setTimerMode('custom', num);
              showToast(`Custom timer set to ${num} minutes.`);
            } else {
              alert('Please enter a valid number between 1 and 180.');
            }
          }
        });

        // Change Subject Pill
        document.getElementById('changeSubjectBtn')?.addEventListener('click', () => {
          const subject = prompt('What topic are you studying in this session?', currentSessionSubject);
          if (subject !== null && subject.trim()) {
            currentSessionSubject = subject.trim();
            const cat = prompt('Category (Sciences, Mathematics, Coding / Tech, Humanities, Languages, Reading, General):', currentSessionCategory);
            if (cat && cat.trim()) currentSessionCategory = cat.trim();
            render();
          }
        });

        // Ambient sound controls
        const ambSelect = document.getElementById('ambientSoundSelect');
        const ambVol = document.getElementById('ambientVolumeRange');

        ambSelect?.addEventListener('change', e => {
          const val = e.target.value;
          state.settings.ambientType = val;
          saveState();
          startAmbientSound(val);
          updateGlobalTimerUI();
        });

        ambVol?.addEventListener('input', e => {
          const val = parseFloat(e.target.value);
          state.settings.ambientVolume = val;
          saveState();
          if (ambientNodes && ambientNodes.gain) {
            ambientNodes.gain.gain.setValueAtTime(val * 0.25, audioCtx.currentTime);
          }
        });
      }

      /* -------------------------------------------------------------
       * Quest Ledger View Event Binding
       * ----------------------------------------------------------- */
      function bindLedgerViewEvents() {
        // Tab switching: Log Completed vs Plan Quest
        document.getElementById('tabLogCompleted')?.addEventListener('click', () => {
          ledgerTab = 'completed';
          render();
        });
        document.getElementById('tabPlanQuest')?.addEventListener('click', () => {
          ledgerTab = 'planned';
          render();
        });

        // Search Input
        const searchInput = document.getElementById('ledgerSearchInput');
        searchInput?.addEventListener('input', e => {
          ledgerSearch = e.target.value;
          render();
          // maintain input focus after re-render
          const newInput = document.getElementById('ledgerSearchInput');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        });

        // Filter chips
        root.querySelectorAll('.filter-chip[data-filter]').forEach(chip => {
          chip.addEventListener('click', () => {
            ledgerFilter = chip.dataset.filter;
            render();
          });
        });

        // Category filter select
        document.getElementById('categoryFilterSelect')?.addEventListener('change', e => {
          ledgerCategory = e.target.value;
          render();
        });

        // Form submission (Add Completed Session OR Add Planned Quest)
        const form = document.getElementById('questForm');
        form?.addEventListener('submit', e => {
          e.preventDefault();
          const data = new FormData(form);
          const subject = String(data.get('subject') || '').trim();
          const category = String(data.get('category') || 'General');
          const hours = Number(data.get('hours')) || 1;

          if (!subject || hours <= 0) return;

          const isCompleted = ledgerTab === 'completed';
          const earnedXP = Math.round(hours * 100);
          const now = new Date();
          const dateStr = isCompleted
            ? 'Today, ' + new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(now)
            : 'Upcoming';

          const newQuest = {
            id: 'quest-' + Date.now(),
            subject,
            category,
            duration: hours,
            date: dateStr,
            xp: earnedXP,
            status: isCompleted ? 'completed' : 'planned'
          };

          if (isCompleted) {
            state.totalXP += earnedXP;
            state.totalHours = +(state.totalHours + hours).toFixed(2);
          }

          state.questHistory = [newQuest, ...state.questHistory];
          saveState();
          render();
          showToast(isCompleted ? `Session logged! +${earnedXP} XP earned.` : 'Quest added to your plan!');
        });

        // Table Action Buttons (Complete Checkbox, Focus Timer, Delete)
        root.querySelectorAll('[data-action="toggle-complete"]').forEach(check => {
          check.addEventListener('change', () => {
            const id = check.dataset.id;
            const quest = state.questHistory.find(q => q.id === id);
            if (!quest) return;

            if (check.checked) {
              quest.status = 'completed';
              quest.date = 'Today, ' + new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(new Date());
              state.totalXP += quest.xp;
              state.totalHours = +(state.totalHours + (Number(quest.duration) || 1)).toFixed(2);
              playZenChime();
              showToast(`Quest completed! +${quest.xp} XP earned.`);
            } else {
              quest.status = 'planned';
              quest.date = 'Upcoming';
              state.totalXP = Math.max(0, state.totalXP - quest.xp);
              state.totalHours = Math.max(0, +(state.totalHours - (Number(quest.duration) || 1)).toFixed(2));
              showToast(`Quest reverted to planned.`);
            }
            saveState();
            render();
          });
        });

        root.querySelectorAll('[data-action="focus-quest"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const quest = state.questHistory.find(q => q.id === id);
            if (quest) {
              currentSessionSubject = quest.subject;
              currentSessionCategory = quest.category || 'General';
              view = 'timer';
              render();
              showToast(`Timer primed for: ${quest.subject}`);
            }
          });
        });

        root.querySelectorAll('[data-action="delete-quest"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const idx = state.questHistory.findIndex(q => q.id === id);
            if (idx === -1) return;

            const [removed] = state.questHistory.splice(idx, 1);
            lastDeletedQuest = { quest: removed, index: idx };

            if (removed.status === 'completed') {
              state.totalXP = Math.max(0, state.totalXP - removed.xp);
              state.totalHours = Math.max(0, +(state.totalHours - (Number(removed.duration) || 1)).toFixed(2));
            }

            saveState();
            render();

            showToast(`Deleted "${removed.subject}"`, 'Undo', () => {
              if (lastDeletedQuest) {
                state.questHistory.splice(lastDeletedQuest.index, 0, lastDeletedQuest.quest);
                if (lastDeletedQuest.quest.status === 'completed') {
                  state.totalXP += lastDeletedQuest.quest.xp;
                  state.totalHours = +(state.totalHours + (Number(lastDeletedQuest.quest.duration) || 1)).toFixed(2);
                }
                saveState();
                render();
                showToast('Restored quest.');
                lastDeletedQuest = null;
              }
            });
          });
        });

        // Backup export & import buttons
        document.getElementById('exportDataBtn')?.addEventListener('click', exportDataAsJSON);
        document.getElementById('importDataBtn')?.addEventListener('click', importDataFromJSON);
      }

      /* -------------------------------------------------------------
       * Keyboard Shortcuts
       * ----------------------------------------------------------- */
      window.addEventListener('keydown', e => {
        // Do not intercept if user is typing inside an input/textarea/select
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        // Escape closes any open modal
        if (e.key === 'Escape') {
          document.getElementById('settingsModal')?.classList.remove('open');
          return;
        }

        // Space toggles timer
        if (e.code === 'Space') {
          e.preventDefault();
          toggleTimer();
          return;
        }

        // R resets timer
        if (e.key === 'r' || e.key === 'R') {
          resetTimer();
          showToast('Timer reset.');
          return;
        }

        // 1, 2, 3, 4 navigates views
        if (e.key === '1') { view = 'lounge'; render(); }
        if (e.key === '2') { view = 'timer'; render(); }
        if (e.key === '3') { view = 'ledger'; render(); }
        if (e.key === '4') { view = 'analytics'; render(); }
      });

      /* -------------------------------------------------------------
       * Initialization
       * ----------------------------------------------------------- */
      loadState();
      render();
    })();
  </script>
</body>
</html>
